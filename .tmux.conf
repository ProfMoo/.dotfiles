##################
# Base Changes   #
##################

# remap prefix from 'C-b' to 'C-o'
unbind C-b
set-option -g prefix C-o
bind-key C-o send-prefix

# split panes using \ and -
bind '\' split-window -h
bind - split-window -v
unbind '"'
unbind %

# setting the default shell of tmux to be zsh
# TODO: Avoid using the hardcoded full path of zsh
set-option -g default-shell /bin/zsh

# reload config file (change file location to your the tmux.conf you want to use)
unbind r
bind r source-file ~/.tmux.conf

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# pane navigation to match Vi directions
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# don't rename windows automatically
set-option -g allow-rename off

##################
# Plugins        #
##################

set -g @plugin 'tmux-plugins/tpm'

# 1. Generic Utilities
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'nhdaly/tmux-better-mouse-mode'
set -g @scroll-speed-num-lines-per-scroll 1

# 2. Themes / Status Bars (Must load BEFORE Continuum)
set -g @plugin 'erikw/tmux-powerline'

# 3. Save / Restore (Must load LAST in the plugin list)
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Continuum Settings
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15' # interval in minutes

# General Settings
set -g detach-on-destroy off

###########################################
# Initializing TPM and Installing Plugins #
###########################################

# Set the PATH variable to ensure all tools installed via Homebrew are accessible
set-environment -g PATH "/opt/homebrew/bin:$PATH"

# 1. First, check and auto-download TPM if it's missing
if "test ! -d ~/.tmux/plugins/tpm" \
    "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm'"

# 2. Second, run the installer script to fetch any missing plugins
run-shell '~/.tmux/plugins/tpm/bin/install_plugins'

# 3. LAST LINE: Initialize TMUX plugin manager to load everything
run '~/.tmux/plugins/tpm/tpm'
